[package]
name = "geometry-dash"
version = "0.1.0"
edition = "2024"
description = "A Geometry Dash-style game and level editor"

[features]
default = ["desktop"]
desktop = ["dep:bevy"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "=0.19.1", optional = true, default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
    "bevy_winit", "x11", "wayland", "keyboard", "mouse",
    "2d_bevy_render", "ui_bevy_render", "default_font", "png",
    "bevy_audio", "vorbis",
] }

[[bin]]
name = "geometry-dash"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

